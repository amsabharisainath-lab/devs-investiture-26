[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "aiocache>=0.12.3",
  "celery[redis]>=5.5.0",
  "gotrue>=2.12.4",
  "fastapi[standard]",
  "jose>=1.0.0",
  "passlib>=1.7.4",
  "pillow>=12.1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "python-jose>=3.5.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.1",
  "psycopg[binary]>=3.3.4",
  "slowapi>=0.1.10",
  "authlib>=1.7.2",
  "itsdangerous>=2.2.0",
  "psycopg2-binary>=2.9.12",
  "celery[redis]>=5.6.3",
  "pdfkit>=1.0.0",
  "reportlab>=5.0.1",
  "pypdf>=6.19.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
